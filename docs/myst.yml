version: 1
project:
  title: Hydrocron
  authors:
    - name: Physical Oceanography Distributed Active Archive Center (PO.DAAC)
  copyright: '2024'
  github: sliu008/hydrocron
  bibliography:
    - references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: intro.md
    - title: GETTING STARTED
      children:
        - file: overview.md
        - file: user-guide/start.md
          children:
            - file: user-guide/fields.md
            - file: user-guide/time.md
            - file: user-guide/versioning.md
        - file: examples.md
        - file: hydrocron_tutorial.ipynb
    - title: API ENDPOINTS
      children:
        - file: timeseries.md
    - title: RESOURCES
      children:
        - url: https://github.com/sliu008/hydrocron
          title: GitHub Repository
        - url: https://podaac.jpl.nasa.gov/SWOT
          title: SWOT Mission Page
        - url: https://www.swordexplorer.com/
          title: SWOT River Database (SWORD) Explorer
        - url: https://podaac.jpl.nasa.gov
          title: PO.DAAC Website
        - url: https://sliu008.github.io/tutorials/
          title: PO.DAAC Cookbook
site:
  base_url: /hydrocron/
  options:
    logo: hydrocron_logo.png
    favicon: hydrocron_logo.png
    folders: true
  template: book-theme
